<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 520px;
            margin: 50px auto;
            padding: 35px;
            text-align: center;
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
        }
        a {
            display: block;
            margin-top: 20px;
            padding: 14px;
            text-decoration: none;
            background-color: #2f7cf6;
            color: white;
            border: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #1f66d1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Week 5 Spring MVC</h1>
    <p>Form DTO와 @ModelAttribute 실습</p>
    <a th:href="@{/product/new}">상품 등록하기</a>
    <a th:href="@{/product}">상품 목록 보기</a>
</div>
</body>
</html>
