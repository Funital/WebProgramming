<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 수정</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 40px;
    }

    .container {
      width: 500px;
      margin: 0 auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 30px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .error {
      margin-top: 5px;
      color: red;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .button-link {
      flex: 1;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    .submit-button {
      background-color: #333;
      color: white;
    }

    .cancel-button {
      background-color: #ddd;
      color: #333;
    }
  </style>
</head>

<body>

<!--     Controller에서 전달되는 Model 데이터
     1. productForm  → 기존 상품 값이 들어 있는 수정 입력·검증용 DTO
     2. productId    → 수정할 Product의 id
     [구현할 기능]
     1. class="container"인 div를 작성하세요.
     2. "상품 수정" 제목을 출력하세요.
     3. form을 작성하세요.
        - 전송 방식: POST
        - 전송 주소: /products/{id}/edit
        - id 값에는 productId 사용
        - productForm과 form 연결
     4. 다음 입력 항목을 작성하세요.
        ① title
        ② price
        ③ quantity
        ④ category
        ⑤ onSale
        각 항목은 ProductForm의 해당 필드와 연결하고 검증 오류 메시지가 표시되도록 작성하세요.
        onSale은 select를 사용합니다.
        true  → 판매 중, false → 판매 중지
     5. "수정 완료" submit 버튼을 작성하세요.
        class="submit-button"
     6. "취소" 링크를 작성하세요.
        - 이동 주소: /products/{id}
        - id 값에는 productId 사용
        - class="button-link cancel-button"

     [사용해야 할 주요 Thymeleaf 문법]
     th:action
     th:object
     th:field
     th:if
     th:errors
     th:href
      -->

<!-- 여기부터 학생이 직접 작성합니다. -->
  <div class="container">
    <h1>상품 수정</h1>
    <form th:action="@{/product/{id}/edit(id=${productId})}" th:object="${productForm}" method="post">

      <!-- ① title -->
      <label for="title">상품명</label>
      <input type="text" id="title" th:field="*{title}" th:errorclass="input-error">
      <p class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">상품명 오류</p>

      <!-- ② price -->
      <label for="price">가격</label>
      <input type="number" id="price" th:field="*{price}" th:errorclass="input-error">
      <p class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">가격 오류</p>

      <!-- ③ quantity -->
      <label for="quantity">수량</label>
      <input type="number" id="quantity" th:field="*{quantity}" th:errorclass="input-error">
      <p class="error-message" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}">수량 오류</p>

      <!-- ④ category -->
      <label for="category">카테고리</label>
      <input type="text" id="category" th:field="*{category}" th:errorclass="input-error">
      <p class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">카테고리 오류</p>

      <!-- ⑤ onSale (select 사용: true -> 판매 중, false -> 판매 중지) -->
      <label for="onSale">판매 상태</label>
      <select id="onSale" th:field="*{onSale}" th:errorclass="input-error">
        <option th:value="true">판매 중</option>
        <option th:value="false">판매 중지</option>
      </select>
      <p class="error-message" th:if="${#fields.hasErrors('onSale')}" th:errors="*{onSale}">판매 상태 오류</p>

      <!-- 5. "수정 완료" submit 버튼 -->
      <button type="submit" class="submit-button">수정 완료</button>

      <!-- 6. "취소" 링크 -->
      <a th:href="@{/products/{id}(id=${productId})}" class="button-link cancel-button">취소</a>
    </form>
  </div>


<!-- 여기까지 학생이 직접 작성합니다. -->

</body>
</html>
