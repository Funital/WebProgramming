<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON TECH FINDER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">WEB PROGRAMMING LAB</p>
      <h1>NEON TECH FINDER</h1>
      <p id="message">미래의 IT 기기를 탐색하는 웹서비스</p>
      <div class="status-line">SYSTEM STATUS
        <span id="status" class="status">OFFLINE</span>   <!--span: Inline-->
      </div>
      <button id="systemButton" type="button">SYSTEM START</button>
    </section>

    <section class="module">
      <p class="eyebrow">CLIENT DOM LAB</p>
      <h2>CATALOG</h2>
      <p>JS로 상품 카드 생성</p>
      <div class="button-area">
        <button id="loadButton" type="button">CATALOG LOAD</button>
        <button id="clearButton" type="button">CLEAR</button>
      </div>
      <div id="catalog" class="catalog-grid">
        <p class="empty-message">생성된 상품 없음</p>
      </div>
    </section>
  </main>
  <script src="js/main.js">

  </script>
</body>
</html>
