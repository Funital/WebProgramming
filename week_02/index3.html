<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Motion Study</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <div class="title-area">
        <p class="small-title">WEB PROGRAMMING</p>
        <h1>CSS Motion Study</h1>
    </div>
    <div class="study-area">
        <h2>1. transform</h2>
        <p>요소의 위치, 크기, 각도를 변경</p>
        <div class="box-area">
            <div class="item">
                <div class="box move">    <!--class 이름 2개-->
                    MOVE
                </div>
                <p>translateX()</p>
            </div>
            <div class="item">
                <div class="box scale">    <!--class 이름 2개-->
                    SCALE
                </div>
                <p>scale()</p>
            </div>
            <div class="item">
                <div class="box rotate">    <!--class 이름 2개-->
                    ROTATE
                </div>
                <p>rotate()</p>
            </div>
        </div>
    </div>
    <div class="study-area">
        <h2>2. transition</h2>
        <p>움직임을 부드럽게 변화</p>
        <div class="compare-area">
            <div class="compare-item">
              <p>transition 없음</p>
              <div class="compare-box fast">WITHOUT</div>
            </div>
            <div class="compare-item">
              <p>transition 있음</p>
              <div class="compare-box smooth">WITH</div>
            </div>
        </div>
    </div>
    <!--animation-->
    <div class="study-area">
        <h2>3. animation</h2>
        <p>자동 움직임</p>
        <div class="animation-area">
            <div class="animation-item">
                <div class="ball"></div>
                <p>BOUNCE</p>
            </div>
            <div class="animation-item">
                <div class="spinner"></div>
                <p>ROTATE</p>
            </div>
            <div class="animation-item">
                <div class="runner"></div>
                <p>MOVE</p>
            </div>
        </div>
    </div>
</body>
</html>
