<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 등록 결과</title>

  <style>
    /*
     body
     → 웹 페이지 전체 영역에 적용됩니다.

     font-family
     → 화면에 표시되는 글꼴을 지정합니다.

     background-color
     → 웹 페이지 전체의 배경색을 지정합니다.
    */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }


    /*
     .container
     → class="container"가 작성된 HTML 요소에 적용됩니다.

     class
     → 여러 HTML 요소에 같은 디자인을 적용하기 위해 사용하는 이름입니다.
    */
    .container {
      width: 460px;                  /* 영역의 너비 */
      margin: 80px auto;             /* 위아래 80px, 좌우 가운데 정렬 */
      padding: 30px;                 /* 영역 안쪽의 여백 */
      background-color: white;       /* 영역의 배경색 */
      border: 1px solid #dddddd;     /* 테두리 */
      border-radius: 12px;           /* 모서리를 둥글게 표시 */
    }


    /*
     h1 태그에 적용됩니다.
     제목을 가운데 정렬합니다.
    */
    h1 {
      text-align: center;
    }


    /*
     .result
     → class="result"가 작성된 div에 적용됩니다.
     → 등록된 상품 정보를 보여 주는 영역입니다.
    */
    .result {
      margin-top: 25px; /* 위쪽 여백 */
      padding: 20px; /* 내부 여백 */
      background-color: #f3faf3; /* 결과 영역의 배경색 */
      border: 1px solid #e3efe3; /* 연한 초록 테두리 */
      border-radius: 8px; /* 모서리를 둥글게 표시 */
    }



    /*
     .result 안에 있는 p 태그에 적용됩니다.
     각 상품 정보 사이에 간격을 줍니다.
    */
    .result p {
      margin: 12px 0;
    }


    /*
     .link-area
     → 다시 등록하기, 메인 화면으로 링크를
       가운데 정렬하기 위한 영역입니다.
    */
    .link-area {
      text-align: center;
    }


    /*
     a
     → 링크에 적용되는 디자인입니다.
    */
    a {
      display: inline-block;
      margin-top: 20px;
    }

    /* 다시 등록하기: 초록 버튼 */
    .btn-retry {
      padding: 12px 28px;
      background-color: #2e9e47;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .btn-retry:hover {
      background-color: #23803a;
    }

    /* 메인 화면으로: 파란 밑줄 링크 */
    .link-home {
      color: #1a56db;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>상품 등록 완료</h1>

  <div class="result">
    <p>상품명: <strong th:text="${productForm.title}">무선 마우스</strong></p>
    <p>가격: <strong th:text="${productForm.price}">25000</strong> 원</p>
    <p>수량: <strong th:text="${productForm.quantity}">10</strong> 개</p>
    <p>카테고리: <strong th:text="${productForm.category}">전자제품</strong></p>
<!--    <p>판매 여부: <strong th:text="${productForm.onSale}">true</strong></p>-->
    <p>
      판매 여부:
      <strong th:text="${productForm.onSale ? '판매 중' : '판매 안 함'}"></strong>
    </p>
  </div>

  <div class="link-area">
    <a class="btn-retry" th:href="@{/products/new}">다시 등록하기</a>
    <br>
    <a th:href="@{/products}">상품 목록 보기</a>
    <br>
    <a class="link-home" th:href="@{/}">메인 화면으로</a>
  </div>
</div>

</body>
</html>
